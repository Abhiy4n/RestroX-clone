/* Approved compact Restro surface refinements */
:root{--primary:#2563eb;--primary-hover:#1d4ed8;--neutral-pill:#f0f1f4;--neutral-ink:#5e6470}

.tag,.tag.ok,.tag.off,.tag.warn{background:var(--neutral-pill);color:var(--neutral-ink);border:1px solid #e9ebef;font-weight:700}
.tag .dot{width:7px;height:7px;flex:none;background:#9196a1}

.stat{position:relative;padding:15px 17px;min-height:108px}.stat .tiny{margin-bottom:9px}.stat .foot{margin-top:7px}
.stat-icon{position:absolute;right:16px;top:15px;color:#9197a1;width:17px;height:17px;stroke-width:1.8;pointer-events:none}

td{padding:12px 14px}th{padding:12px 14px}.toolbar{padding:12px 14px}.table-foot{padding:11px 14px}

.copy svg{width:14px;height:14px;transition:transform 170ms var(--ease),opacity 170ms}
.copy:hover{transform:translateY(-1px)}.copy.copied{color:#218653}.copy.copied svg{animation:copy-pop 200ms var(--ease) both}
@keyframes copy-pop{from{opacity:.35;transform:scale(.65) rotate(-10deg)}to{opacity:1;transform:scale(1) rotate(0)}}
.modal{width:min(100%,610px);border-radius:12px;box-shadow:0 22px 65px rgba(22,27,39,.19);overflow:visible;position:relative}
.modal-top{justify-content:center;text-align:center;padding:25px 45px 15px}

.close:hover{background:#f5f6f9;transform:rotate(12deg)}

.overlay.is-closing{opacity:0;pointer-events:none}.overlay.is-closing .modal{transform:translateY(9px) scale(.985)}

.modal-footer{margin:0 28px;padding:17px 0 22px;border-top:1px solid #eef0f3;gap:10px}

<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" id="modalContent"></div></div><div id="searchOverlay" class="search-pop" onclick="if(event.target===this)closeSearch()"><div class="search-modal" role="dialog" aria-modal="true" aria-label="Search navigation"><div class="search-top"><i data-lucide="search" width="17" color="#828a96"></i><input id="searchInput" autocomplete="off" placeholder="Search navigation..." oninput="renderSearch()" onkeydown="searchKeys(event)"><span class="keycap">Esc</span></div><div id="searchItems" class="search-items"></div></div></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];const icons=()=>window.lucide?.createIcons(); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); const id=()=>Math.random().toString(36).slice(2,8).toUpperCase();const today=()=>new Date().toISOString().slice(0,10);let merchants=[{id:'mer_8K2B94',name:'Hotel Booking System',url:'https://hotel.example',type:'Website',active:true,created:'2026-10-18'},{id:'mer_7A4E21',name:'Shop Checkout Demo',url:'https://shop.example',type:'Website',active:true,created:'2026-10-17'},{id:'mer_5C9D33',name:'Mobile Wallet Testing',url:'',type:'Mobile App',active:false,created:'2026-10-15'}];let keys=[{id:'key_1',merchant:'mer_8K2B94',name:'Development Backend',hint:'•••• 2fQ8',status:'Active',created:'2026-10-18',expires:'',last:'Never'},{id:'key_2',merchant:'mer_7A4E21',name:'Checkout Integration',hint:'•••• m2Xa',status:'Active',created:'2026-10-17',expires:'2027-01-15',last:'2026-10-20'},{id:'key_3',merchant:'mer_5C9D33',name:'Old Testing Key',hint:'•••• 8sLd',status:'Revoked',created:'2026-10-15',expires:'',last:'2026-10-16'}];let view='merchants',selectedMerchant=null,detailTab='overview',merchantFilter='',merchantState='all',keyFilter='all',keyStatus='all',demoState='normal',secretInMemory=null,modalKind='',searchSelected=0,toastTimer;
function notify(msg){const e=$('#toast');e.textContent=msg;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),2400)}async function copy(text){try{await navigator.clipboard.writeText(text);return true}catch(err){notify('Clipboard unavailable');return false}}
async function copyWithFeedback(button,value){if(!value)return;const ok=await copy(value);if(!ok)return;clearTimeout(button._copyTimer);button.classList.add('copied');button.setAttribute('aria-label','Copied');button.title='Copied';button.innerHTML='<i data-lucide="check"></i>';icons();button._copyTimer=setTimeout(()=>{if(!button.isConnected)return;button.classList.remove('copied');button.setAttribute('aria-label','Copy');button.title='Copy';button.innerHTML='<i data-lucide="copy"></i>';icons()},1450)}function navigate(p){if(['merchants','keys','detail'].includes(p)){view=p;selectedMerchant=p==='detail'?selectedMerchant:null;render();return}notify('This prototype focuses on Merchants and API Keys only')}function header(title,subtitle,action=''){return `<div class="eyebrow">RESTRO / SANDBOX / INTEGRATION</div><div class="page-head"><div><h1>${title}</h1><p class="sub">${subtitle}</p></div><div class="actions">${action}</div></div>`}function urlLink(raw){if(!raw)return '<span class="second">No website provided</span>';try{const u=new URL(raw);if(!['http:','https:'].includes(u.protocol))throw Error('Unsupported scheme');return `<a class="merchant-url" href="${esc(u.href)}" target="_blank" rel="noopener noreferrer" title="Open ${esc(raw)} in a new tab"><i data-lucide="globe-2"></i><span>${esc(raw)}</span><i class="external-mark" data-lucide="arrow-up-right"></i></a>`}catch{return `<span class="second">${esc(raw)}</span>`}}
function badge(text){let cls=text==='Active'?'ok':['Disabled','Revoked'].includes(text)?'off':text==='Expired'?'warn':'';let dot=['Active','Disabled','Revoked','Expired'].includes(text)?'<span class="dot"></span>':'';return `<span class="tag ${cls}">${dot}${esc(text)}</span>`}function render(){let content;if(view==='merchants')content=merchantsPage();else if(view==='keys')content=keysPage();else content=detailPage();$('#main').innerHTML=`<div class="page-appear">${content}</div>`;$$('.nav').forEach(e=>e.classList.toggle('active',e.dataset.page===(view==='detail'?'merchants':view)));$$('.mobile-nav button').forEach(e=>e.classList.toggle('active',e.id===`mobile-${view==='detail'?'merchants':view}`));icons()}
function merchantsPage(){const rows=merchants.filter(m=>(merchantState==='all'||(merchantState==='active'===m.active))&&`${m.name} ${m.id} ${m.url}`.toLowerCase().includes(merchantFilter.toLowerCase()));return header('Merchants','Manage applications connected to your sandbox environment.',`<button class="btn ghost" onclick="showStates()"><i data-lucide="sliders-horizontal"></i>Preview states</button><button class="btn primary" onclick="merchantModal()"><i data-lucide="plus"></i>Create merchant</button>`)+`<div class="stats"><div class="stat panel"><i class="stat-icon" data-lucide="store"></i><div class="tiny">Total merchants</div><strong>${merchants.length}</strong><div class="foot">Registered integrations</div></div><div class="stat panel"><i class="stat-icon" data-lucide="check-circle-2"></i><div class="tiny">Active merchants</div><strong>${merchants.filter(m=>m.active).length}</strong><div class="foot">Available for sandbox testing</div></div><div class="stat panel"><i class="stat-icon" data-lucide="shield-check"></i><div class="tiny">Environment</div><strong style="font-size:18px">Sandbox</strong><div class="foot">Virtual transactions only</div></div></div><div class="panel"><div class="toolbar"><div class="tool-left"><div class="input-icon"><i data-lucide="search"></i><input id="merchantSearch" class="field" value="${esc(merchantFilter)}" placeholder="Search merchants..." oninput="merchantFilter=this.value;refreshMerchantRows()"></div><select class="field filter" onchange="merchantState=this.value;refreshMerchantRows()"><option value="all">All statuses</option><option value="active" ${merchantState==='active'?'selected':''}>Active</option><option value="disabled" ${merchantState==='disabled'?'selected':''}>Disabled</option></select></div><span class="muted" style="font-size:10px">${rows.length} merchants</span></div><div id="merchantRows">${merchantTable(rows)}</div></div>`}
function refreshMerchantRows(){const rows=merchants.filter(m=>(merchantState==='all'||(merchantState==='active'?m.active:!m.active))&&`${m.name} ${m.id} ${m.url}`.toLowerCase().includes(merchantFilter.toLowerCase()));$('#merchantRows').innerHTML=merchantTable(rows);icons()}
function merchantTable(rows){if(demoState==='loading')return `<div class="empty"><div class="loading-line" style="width:240px"></div><div class="loading-line" style="width:340px"></div><div class="loading-line" style="width:270px"></div></div>`;if(demoState==='error')return `<div class="empty"><div class="empty-icon"><i data-lucide="alert-circle"></i></div><h3>Couldn't load merchants</h3><p>Unable to retrieve merchants. Please try again.</p><button class="btn" onclick="demoState='normal';refreshMerchantRows()">Try again</button></div>`;if(!rows.length)return `<div class="empty"><div class="empty-icon"><i data-lucide="store"></i></div><h3>No merchants found</h3><p>Create your first merchant or adjust your search and status filter.</p><button class="btn" onclick="merchantModal()">Create merchant</button></div>`;return `<div class="table-wrap"><table style="min-width:820px"><thead><tr><th class="sn-col">SN</th><th>Merchant</th><th>Merchant ID</th><th>Integration</th><th>Status</th><th>Environment</th><th></th></tr></thead><tbody>${rows.map((m,i)=>`<tr><td class="sn-col">${i+1}</td><td><span class="name">${esc(m.name)}</span>${urlLink(m.url)}</td><td><span class="mono">${esc(m.id)}</span> <button class="copy" title="Copy merchant ID" aria-label="Copy merchant ID" onclick="copyWithFeedback(this,'${m.id}')"><i data-lucide="copy"></i></button></td><td>${badge(m.type)}</td><td>${badge(m.active?'Active':'Disabled')}</td><td>${badge('Sandbox')}</td><td><button class="link" onclick="openDetail('${m.id}')">View details <i class="detail-arrow" data-lucide="arrow-up-right"></i></button></td></tr>`).join('')}</tbody></table></div><div class="table-foot">Showing ${rows.length} of ${merchants.length} merchants</div>`}
function openDetail(mid){selectedMerchant=mid;detailTab='overview';navigate('detail')}function detailPage(){const m=merchants.find(x=>x.id===selectedMerchant);if(!m){view='merchants';return merchantsPage()}const mk=keys.filter(k=>k.merchant===m.id);return `<button class="link" onclick="navigate('merchants')" style="margin-bottom:18px"><i data-lucide="arrow-left" style="width:14px;vertical-align:middle"></i> All merchants</button>`+header(esc(m.name),`Merchant ID <span class="mono">${m.id}</span> &nbsp; <button class="copy" onclick="copy('${m.id}')" aria-label="Copy merchant ID"><i data-lucide="copy"></i></button>`,`<button class="btn" onclick="merchantModal('${m.id}')"><i data-lucide="pencil"></i>Edit merchant</button><button class="btn ${m.active?'danger':''}" onclick="toggleMerchant('${m.id}')">${m.active?'Disable':'Re-enable'}</button>`)+`<div class="detail-tabs"><button class="tab ${detailTab==='overview'?'active':''}" onclick="detailTab='overview';render()">Overview</button><button class="tab ${detailTab==='credentials'?'active':''}" onclick="detailTab='credentials';render()">API credentials</button></div>${detailTab==='overview'?`<div class="detail-grid"><div class="panel detail-card"><h3>Basic information</h3><div class="info-row"><span>Merchant name</span><b>${esc(m.name)}</b></div><div class="info-row"><span>Merchant ID</span><b class="mono">${m.id}</b></div><div class="info-row"><span>Website/application URL</span><b>${m.url?urlLink(m.url):'Not provided'}</b></div><div class="info-row"><span>Integration type</span>${badge(m.type)}</div><div class="info-row"><span>Created</span><b>${m.created}</b></div></div><div class="panel detail-card"><h3>Sandbox settings</h3><div class="info-row"><span>Environment</span>${badge('Sandbox')}</div><div class="info-row"><span>Merchant status</span>${badge(m.active?'Active':'Disabled')}</div><div class="info-row"><span>API credentials</span><b>${mk.length} keys</b></div><button class="btn" style="margin-top:18px" onclick="detailTab='credentials';render()">Manage API credentials <i data-lucide="arrow-right"></i></button></div></div>`:`<div class="section-row"><h2>API credentials</h2><button class="btn primary" onclick="keyModal('${m.id}')"><i data-lucide="plus"></i>Generate key</button></div><div class="panel">${keyTable(mk)}</div>`}`}
function toggleMerchant(mid){const m=merchants.find(x=>x.id===mid);modalKind='toggle';showModal(`<div class="modal-top"><div><h2 id="modalTitle">${m.active?'Disable':'Re-enable'} merchant?</h2><p class="sub">${esc(m.name)}</p></div><button class="close" onclick="closeModal()" aria-label="Close"><i data-lucide="x"></i></button></div><div class="modal-body"><p class="sub">${m.active?'This merchant will no longer be able to authenticate new sandbox payment requests.':'This merchant will be enabled for sandbox integration again.'}</p></div><div class="modal-footer"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn ${m.active?'danger':'primary'}" onclick="merchants.find(x=>x.id==='${mid}').active=${!m.active};closeModal();render();notify('Merchant status updated')">Confirm</button></div>`)}
function merchantModal(mid){const m=merchants.find(x=>x.id===mid);modalKind='merchant';showModal(`<form onsubmit="saveMerchant(event,'${mid||''}')"><div class="modal-top"><div><h2 id="modalTitle">${m?'Edit merchant':'Create merchant'}</h2><p class="sub">${m?'Update the sandbox integration details.':'Register a new application for testing.'}</p></div><button class="close" type="button" onclick="closeModal()" aria-label="Close"><i data-lucide="x"></i></button></div><div class="modal-body"><div class="form-group"><label for="merchantName">Merchant name <span style="color:#b84c4c">*</span></label><input class="field" id="merchantName" maxlength="80" required placeholder="e.g. Hotel Booking System" value="${esc(m?.name||'')}"><span id="nameError" class="error"></span></div><div class="form-split"><div class="form-group"><label for="merchantUrl">Website / application URL <span class="muted">(optional)</span></label><input class="field" id="merchantUrl" type="url" placeholder="https://example.com" value="${esc(m?.url||'')}"><span id="urlError" class="error"></span></div><div class="form-group"><label for="merchantType">Integration type</label><select class="field" id="merchantType"><option ${m?.type==='Website'?'selected':''}>Website</option><option ${m?.type==='Mobile App'?'selected':''}>Mobile App</option><option ${m?.type==='Backend API'?'selected':''}>Backend API</option></select></div></div><p class="form-quiet-note">Sandbox only. All transactions are simulated.</p></div><div class="modal-footer"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button id="saveMerchantBtn" type="submit" class="btn primary">${m?'Save changes':'Create merchant'}</button></div></form>`);setTimeout(()=>$('#merchantName')?.focus(),120)}
function saveMerchant(e,mid){e.preventDefault();const name=$('#merchantName').value.trim(),url=$('#merchantUrl').value.trim(),type=$('#merchantType').value;if(name.length<2){$('#nameError').textContent='Enter at least 2 characters.';return}const btn=$('#saveMerchantBtn');btn.disabled=true;btn.innerHTML='<i data-lucide="loader-circle" class="spinner"></i> Saving...';icons();setTimeout(()=>{if(mid){Object.assign(merchants.find(x=>x.id===mid),{name,url,type})}else{const mid2='mer_'+id();merchants.unshift({id:mid2,name,url,type,active:true,created:today()})}closeModal();render();notify(mid?'Merchant updated':'Merchant created')},480)}
function keysPage(){let filtered=keys.filter(k=>(keyFilter==='all'||k.merchant===keyFilter)&&(keyStatus==='all'||statusFor(k).toLowerCase()===keyStatus));return header('API keys','Issue and manage merchant-scoped sandbox credentials.',`<button class="btn primary" onclick="keyModal()"><i data-lucide="plus"></i>Generate API key</button>`)+`<div class="stats"><div class="stat panel"><i class="stat-icon" data-lucide="key-round"></i><div class="tiny">Total keys</div><strong>${keys.length}</strong><div class="foot">Across all merchants</div></div><div class="stat panel"><i class="stat-icon" data-lucide="shield-check"></i><div class="tiny">Active keys</div><strong>${keys.filter(k=>statusFor(k)==='Active').length}</strong><div class="foot">Available for API authentication</div></div><div class="stat panel"><i class="stat-icon" data-lucide="key-round"></i><div class="tiny">Revoked / expired</div><strong>${keys.filter(k=>statusFor(k)!=='Active').length}</strong><div class="foot">No longer valid</div></div></div><div class="panel"><div class="toolbar"><div class="tool-left"><select class="field filter" onchange="keyFilter=this.value;render()"><option value="all">All merchants</option>${merchants.map(m=>`<option value="${m.id}" ${keyFilter===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select><select class="field filter" onchange="keyStatus=this.value;render()"><option value="all">All statuses</option>${['active','expired','revoked'].map(s=>`<option value="${s}" ${keyStatus===s?'selected':''}>${s[0].toUpperCase()+s.slice(1)}</option>`).join('')}</select></div><span class="muted" style="font-size:10px">${filtered.length} keys</span></div>${keyTable(filtered)}</div>`}
function statusFor(k){return k.status==='Revoked'?'Revoked':k.expires&&k.expires<today()?'Expired':'Active'}function keyTable(arr){if(!arr.length)return `<div class="empty"><div class="empty-icon"><i data-lucide="key-round"></i></div><h3>No API keys found</h3><p>Generate a sandbox API key to connect an application.</p><button class="btn primary" onclick="keyModal(${selectedMerchant?`'${selectedMerchant}'`:''})">Generate API key</button></div>`;return `<div class="table-wrap"><table style="min-width:850px"><thead><tr><th class="sn-col">SN</th><th>Key name</th><th>Merchant</th><th>Safe hint</th><th>Status</th><th>Created</th><th>Last used / expiry</th><th></th></tr></thead><tbody>${arr.map((k,i)=>`<tr><td class="sn-col">${i+1}</td><td><span class="name">${esc(k.name)}</span></td><td>${esc(merchants.find(m=>m.id===k.merchant)?.name||'Unknown')}</td><td><span class="mono">${esc(k.hint)}</span></td><td>${badge(statusFor(k))}</td><td>${esc(k.created)}</td><td>${esc(k.last)}<span class="second">${k.expires?'Expires '+k.expires:'No expiration'}</span></td><td>${statusFor(k)==='Active'?`<button class="link" onclick="revokeKey('${k.id}')" style="color:#ad5555">Revoke</button>`:'<span class="muted">—</span>'}</td></tr>`).join('')}</tbody></table></div><div class="table-foot">Secret values cannot be retrieved after creation.</div>`}
function keyModal(preselect){if(!merchants.length){notify('Create a merchant first');return}modalKind='key';showModal(`<form onsubmit="generateKey(event)"><div class="modal-top"><div><h2 id="modalTitle">Generate API key</h2><p class="sub">Create a secret credential for one merchant.</p></div><button type="button" class="close" onclick="closeModal()" aria-label="Close"><i data-lucide="x"></i></button></div><div class="modal-body"><div class="form-group"><label for="keyMerchant">Merchant</label><select class="field" id="keyMerchant" required>${merchants.filter(m=>m.active).map(m=>`<option value="${m.id}" ${preselect===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select>${!merchants.some(m=>m.active)?'<span class="error">Enable a merchant first.</span>':''}</div><div class="form-group"><label for="keyName">Key name</label><input class="field" id="keyName" required maxlength="70" placeholder="e.g. Local development"><span class="hint">Use a name that identifies where this key will be used.</span></div><div class="form-group"><label for="keyExpire">Expiration <span class="muted">(optional)</span></label><input type="date" min="${today()}" class="field" id="keyExpire"><span class="hint">Leave blank for a key without a scheduled expiration.</span></div><p class="form-quiet-note">Your secret is shown only once. Copy it before closing the next dialog.</p></div><div class="modal-footer"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="generateBtn" ${!merchants.some(m=>m.active)?'disabled':''} type="submit">Generate key</button></div></form>`)}
function generateKey(e){e.preventDefault();const mid=$('#keyMerchant').value,name=$('#keyName').value.trim(),expires=$('#keyExpire').value;if(!name)return;const btn=$('#generateBtn');btn.disabled=true;btn.innerHTML='<i data-lucide="loader-circle" class="spinner"></i> Generating...';icons();setTimeout(()=>{const bytes=new Uint8Array(24);crypto.getRandomValues(bytes);const secret='rsk_test_'+Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');secretInMemory=secret;keys.unshift({id:'key_'+id(),merchant:mid,name,hint:'•••• '+secret.slice(-4),status:'Active',created:today(),expires,last:'Never'});secretModal(secret)},420)}
function secretModal(secret){modalKind='secret';showModal(`<div class="modal-top"><div><h2 id="modalTitle">Your new secret API key</h2><p class="sub">Store this credential securely.</p></div></div><div class="modal-body"><div class="alert"><strong>Copy this key now.</strong> It won't be shown again after this dialog closes. Never put a secret key in frontend source code or public repositories.</div><div class="secret-box"><code id="secretText">${esc(secret)}</code><button class="copy" title="Copy secret key" aria-label="Copy secret key" onclick="copyWithFeedback(this,secretInMemory)"><i data-lucide="copy"></i></button></div><label style="display:flex;align-items:center;gap:9px;margin-top:20px;font-size:11px;font-weight:700"><input id="secretAcknowledged" type="checkbox" onchange="$('#doneSecret').disabled=!this.checked"> I have copied or saved this key securely.</label></div><div class="modal-footer"><button class="btn primary" id="doneSecret" disabled onclick="dismissSecret()">I've saved the key</button></div>`)}function copySecret(){if(secretInMemory)copy(secretInMemory)}function dismissSecret(){secretInMemory=null;closeModal(true);render();notify('API key created')}function revokeKey(kid){const k=keys.find(x=>x.id===kid);modalKind='revoke';showModal(`<div class="modal-top"><div><h2 id="modalTitle">Revoke API key?</h2><p class="sub">${esc(k.name)}</p></div><button class="close" onclick="closeModal()"><i data-lucide="x"></i></button></div><div class="modal-body"><div class="alert">Revoking this key will immediately invalidate it for API requests. This action cannot be undone.</div><p class="sub">To restore access, generate a new key for this merchant.</p></div><div class="modal-footer"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="keys.find(x=>x.id==='${kid}').status='Revoked';closeModal();render();notify('API key revoked')">Revoke key</button></div>`)}
function showStates(){showModal(`<div class="modal-top"><div><h2 id="modalTitle">Preview interface states</h2><p class="sub">Test the merchant list states.</p></div><button class="close" onclick="closeModal()"><i data-lucide="x"></i></button></div><div class="modal-body" style="display:grid;gap:10px">${[['normal','Normal data'],['loading','Loading skeleton'],['error','API error'],['empty','Empty results']].map(([state,title])=>`<button class="btn" style="justify-content:flex-start" onclick="demoState='${state}';merchantFilter='${state==='empty'?'no-results-match':''}';closeModal();render()">${title}</button>`).join('')}</div>`)}
let modalCloseTimer;function showModal(html){clearTimeout(modalCloseTimer);$('#overlay').classList.remove('is-closing');$('#modalContent').innerHTML=html;$('#overlay').classList.add('open');document.body.style.overflow='hidden';icons()}
function closeModal(force=false){if(modalKind==='secret'&&!force){notify('Please acknowledge and dismiss the secret first');return}const overlay=$('#overlay');overlay.classList.add('is-closing');if(force||modalKind!=='secret')secretInMemory=null;modalKind='';clearTimeout(modalCloseTimer);modalCloseTimer=setTimeout(()=>{overlay.classList.remove('open','is-closing');document.body.style.overflow=''},210)}
const navItems=[['Merchants','merchants','store'],['API Keys','keys','key-round']];function openSearch(){searchSelected=0;$('#searchOverlay').classList.add('open');$('#searchInput').value='';renderSearch();setTimeout(()=>$('#searchInput').focus(),50)}function closeSearch(){$('#searchOverlay').classList.remove('open')}function renderSearch(){const q=$('#searchInput').value.toLowerCase();const result=navItems.filter(x=>x[0].toLowerCase().includes(q));searchSelected=Math.min(searchSelected,Math.max(result.length-1,0));$('#searchItems').innerHTML=result.length?result.map(([name,path,icon],i)=>`<button class="search-option ${searchSelected===i?'selected':''}" onclick="closeSearch();navigate('${path}')"><i data-lucide="${icon}"></i>${name}<em>Integration</em></button>`).join(''):'<div class="empty" style="padding:28px">No matching navigation pages.</div>';icons()}function searchKeys(e){const count=$$('.search-option').length;if(e.key==='ArrowDown'){e.preventDefault();searchSelected=Math.min(count-1,searchSelected+1);renderSearch()}else if(e.key==='ArrowUp'){e.preventDefault();searchSelected=Math.max(0,searchSelected-1);renderSearch()}else if(e.key==='Enter'){e.preventDefault();$$('.search-option')[searchSelected]?.click()}}
function toggleAccount(){const btn=$('#accountBtn'),menu=$('#accountMenu'),next=!menu.classList.contains('open');menu.classList.toggle('open',next);btn.setAttribute('aria-expanded',String(next))}document.addEventListener('pointerdown',e=>{if(!e.target.closest('.menu-anchor')){$('#accountMenu').classList.remove('open');$('#accountBtn').setAttribute('aria-expanded','false')}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modalKind==='secret'&&$('#overlay').classList.contains('open'))return;closeModal();closeSearch();$('#accountMenu').classList.remove('open');$('#accountBtn').setAttribute('aria-expanded','false')}if((e.key==='/'||((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'))&&!e.target.closest('input,textarea,select,[contenteditable]')&&!$('#overlay').classList.contains('open')){e.preventDefault();openSearch()}});render();icons();
</script></body></html>
